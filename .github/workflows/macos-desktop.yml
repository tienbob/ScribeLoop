name: macOS desktop
on:
  pull_request:
    paths:
      - 'shell/macos/**'
      - 'packaging/macos/**'
      - 'core/**'
      - 'tests/test_desktop*'
      - 'tests/native_streaming_status.swift'
      - '.github/workflows/macos-desktop.yml'
  workflow_dispatch:
jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile native production UI
        run: |
          xcrun swiftc -parse-as-library -swift-version 5 -O \
            -module-cache-path "$RUNNER_TEMP/swift-cache" \
            shell/macos/Desktop/DesktopClient.swift \
            shell/macos/Desktop/MeetingPlayback.swift \
            shell/macos/Desktop/PlaybackSmoke.swift \
            shell/macos/Desktop/Appearance.swift \
            shell/macos/Desktop/DesktopApp.swift \
            shell/macos/Desktop/Preferences.swift \
            -o "$RUNNER_TEMP/ScribeLoop"
      - name: Compile isolated fixture UI
        run: |
          xcrun swiftc -parse-as-library -swift-version 5 \
            -module-cache-path "$RUNNER_TEMP/swift-cache" \
            shell/macos/ScribeLoop/CoreSupervisor.swift \
            shell/macos/ScribeLoop/ScribeLoopApp.swift \
            -o "$RUNNER_TEMP/ScribeLoopM0"
      - name: Verify native streaming status without audio or core launch
        run: |
          xcrun swiftc -parse-as-library -swift-version 5 -O \
            -module-cache-path "$RUNNER_TEMP/swift-cache" \
            shell/macos/Desktop/DesktopClient.swift \
            shell/macos/Desktop/MeetingPlayback.swift \
            tests/native_streaming_status.swift \
            -o "$RUNNER_TEMP/ScribeLoopStreamingStatus"
          "$RUNNER_TEMP/ScribeLoopStreamingStatus"
