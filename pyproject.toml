[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scribeloop-core"
version = "0.1.0"
description = "ScribeLoop core: system-audio capture, streaming ASR, speaker diarization, LLM summaries. Local-first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "async-timeout>=4,<6; python_version < '3.11'",
    "soundfile>=0.12",
    "pydantic>=2.6",
    "openai>=1.30",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=15,<18",
    "platformdirs>=4.2",
    "sqlite-vec==0.1.9",
]

[project.optional-dependencies]
# Cloud is the default. Install these only for explicit local experiments.
local-asr = ["faster-whisper>=1.0", "silero-vad>=5.1", "av>=11,<19"]
# Offline diarization (pyannote community-1). HF-gated model download happens
# at runtime with a user token (ARCHITECTURE.md §9) — see speakers/README.
diar = ["pyannote.audio>=3.3", "torch>=2.2"]
# At-rest encryption; SQLCipher binding needs a compatible native library on source builds.
security = ["cryptography>=43,<51", "keyring>=25,<26"]
sqlcipher = ["sqlcipher3>=0.6.4,<0.7"]
# Bake-off candidates
sherpa = ["sherpa-onnx>=1.10"]
moonshine = ["useful-moonshine"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.package-data]
scribeloop_core = ["api/static/*"]
